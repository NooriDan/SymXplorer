# The universal circuit setup file
project:
  name: Tunable-TIA
  description: Tunable TIA BPF example sizing in the ihp-sg13g2 technology
  simulator: ngspice

  ws_root : /foss/designs/eda/SymXplorer
  # The following paths are relative to the ws_root
  netlist : examples/tunable-tia/ihp-sg13g2/spice/tb_ac.spice
  outdir  : examples/tunable-tia/scripts/optimizer_output
  
  tech_spec : 
    name : ihp-sg13g2
    # PDK RULES
    constraints:
      # n-fet
      max_nfet_w : 10u
      min_nfet_w : 0.18u
      max_nfet_l : 10u
      min_nfet_l : 0.18u

      # p-fet
      max_pfet_w : 10u
      min_pfet_w : 0.18u
      max_pfet_l : 10u
      min_pfet_l : 0.18u

      # capacitor (mim)
      max_cap_w : 10u
      min_cap_w : 1.0u
      max_cap_l : 10u
      min_cap_l : 1.0u

      # resistor
      max_res_w : 10u 
      min_res_w : 1.0u
      max_res_l : 10u 
      min_res_l : 1.0u

  pvt: 
    temp: 25
    corner: tt
    supply: 1.8
  
  params:
    dut:
      - name : x_dut_nfet_w
        min_val: min_nfet_w
        max_val: max_nfet_w
        log_scale: true
        default: 0.4u
      
      - name : x_dut_nfet_l
        min_val: min_nfet_l
        max_val: max_nfet_l

    testbench:
      name: tb_ac
      params: 
        ...

  probes: 
    - name: Vout neg
      node: out
      type: voltage
    - name: Iin pos
      node: i
      type: current
    # - name: Vin
    #   node: in
    #   type: voltage

  optimizer_config:
    name: CMA
    type: nevergrad
    budget: 10
    random_seed: 48

    loss_function:
      max_loss: inf
      loss_norm_method: min-max
      loss_type:        mse
      rescale_mag:      True
      include_phase_loss: True
      include_mag_loss: True

    lin_variable_bounds:
      min : 0
      max : 100

    log_variable_bounds:
      min : 1
      max : 100
  